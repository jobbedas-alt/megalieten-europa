<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megalieten in Europa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#263238}header{padding:12px 16px;background:#f3f6f4}h1{font-size:20px;margin:0 0 4px}p{margin:0;font-size:14px}#map{height:calc(100% - 65px);width:100%}.leaflet-popup-content{max-width:260px;font-size:14px;line-height:1.4}.leaflet-popup-content h2{font-size:17px;margin:0 0 6px}.leaflet-popup-content img{width:100%;height:130px;object-fit:cover;border-radius:5px;margin-top:7px}.tag{font-weight:bold;color:#345d49}
</style></head>
<body>
<header><h1>Megalieten in Europa</h1><p>Klik op een merkteken om te ontdekken waar het monument ligt en hoe oud het is.</p></header>
<div id="map" role="application" aria-label="Interactieve kaart van megalieten in Europa"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map=L.map('map').setView([48.5,5.5],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap-bijdragers',maxZoom:18}).addTo(map);
const places=[
 {name:'Dolmens van Wéris',where:'Wéris, Durbuy, België',age:'ongeveer 3000–2800 v.C.',desc:'In de omgeving van Wéris liggen verschillende dolmens en menhirs. De dolmens zijn prehistorische grafmonumenten, opgebouwd uit grote stenen.',lat:50.326,lon:5.531,img:'https://commons.wikimedia.org/wiki/Special:FilePath/Dolmen%20of%20W%C3%A9ris.jpg'},
 {name:'Stonehenge',where:'Wiltshire, Engeland, Verenigd Koninkrijk',age:'gebouwd en aangepast vanaf ongeveer 3000 v.C.',desc:'Stonehenge is een beroemde cirkel van grote rechtopstaande stenen. Het monument werd in verschillende fasen gebouwd.',lat:51.1789,lon:-1.8262,img:'https://commons.wikimedia.org/wiki/Special:FilePath/Stonehenge aerial view.jpg'},
 {name:'Carnac',where:'Bretagne, Frankrijk',age:'ongeveer 4500–3300 v.C.',desc:'Bij Carnac staan duizenden menhirs in lange rijen. Menhirs zijn grote stenen die rechtop in de grond zijn geplaatst.',lat:47.594,lon:-3.079,img:'https://commons.wikimedia.org/wiki/Special:FilePath/Alignements%20de%20Carnac.jpg'},
 {name:'Newgrange',where:'County Meath, Ierland',age:'ongeveer 3200 v.C.',desc:'Newgrange is een grote grafheuvel met een gang die naar een grafkamer leidt. Het monument is ouder dan Stonehenge en de Egyptische piramiden van Gizeh.',lat:53.6947,lon:-6.475,img:'https://commons.wikimedia.org/wiki/Special:FilePath/Newgrange%20-%20geograph.org.uk%20-%201053.jpg'},
 {name:'Dolmen van Menga',where:'Antequera, Andalusië, Spanje',age:'ongeveer 3700–3500 v.C.',desc:'Dit is een groot prehistorisch graf dat bestaat uit enorme rechtopstaande stenen met zware dekstenen erboven.',lat:37.025,lon:-4.545,img:'https://commons.wikimedia.org/wiki/Special:FilePath/Dolmen%20de%20Menga.jpg'}
];
places.forEach(p=>{const html=`<h2>${p.name}</h2><div><span class="tag">Waar?</span> ${p.where}</div><div><span class="tag">Hoe oud?</span> ${p.age}</div><p>${p.desc}</p><img src="${p.img}" alt="Afbeelding van ${p.name}" onerror="this.style.display='none'">`;L.marker([p.lat,p.lon]).addTo(map).bindPopup(html,{maxWidth:280});});
</script></body></html>
